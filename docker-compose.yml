version: '3.8'

services:
  logseq-mcp-http:
    build: .
    container_name: logseq-mcp-http
    environment:
      - LOGSEQ_GRAPH_PATH=/logseq-graph
      - PORT=7842
      # Optional: Set API_KEY for authentication
      # - API_KEY=your-secret-key-here
    volumes:
      # Mount your Logseq graph directory here
      # Replace with your actual Logseq graph path
      - /path/to/your/logseq/graph:/logseq-graph:rw
    ports:
      - "7842:7842"
    restart: unless-stopped
